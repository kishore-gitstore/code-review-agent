<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Code Review Agent — Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  /* ── tokens (light first; dark redefines the same names) ─────────────── */
  :root {
    color-scheme: light;
    --page: #f9f9f7; --surface: #fcfcfb; --surface-2: #f3f3f0;
    --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
    --grid: #e1e0d9; --axis: #c3c2b7; --border: rgba(11,11,11,0.10);
    --accent: #2a78d6; --accent-wash: rgba(42,120,214,0.10);
    /* categorical slots — fixed order, one entity per slot, never re-assigned */
    --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300;
    /* status — reserved for meaning, always paired with a label */
    --good: #0ca30c; --good-text: #006300; --warning: #fab219; --serious: #ec835a; --critical: #d03b3b;
    --sev-low: #898781;
    /* ordinal ramp (ordered stages) */
    --ord1: #86b6ef; --ord2: #3987e5; --ord3: #1c5cab;
    --shadow: 0 1px 2px rgba(0,0,0,.05), 0 6px 20px rgba(0,0,0,.05);
  }
  /* dark: follows the OS unless the theme toggle stamps data-theme on <html> */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --page: #0d0d0d; --surface: #1a1a19; --surface-2: #222221;
      --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781;
      --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10);
      --accent: #3987e5; --accent-wash: rgba(57,135,229,0.16);
      --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300;
      --good-text: #0ca30c;
      --shadow: none;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --surface-2: #222221;
    --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10);
    --accent: #3987e5; --accent-wash: rgba(57,135,229,0.16);
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300;
    --good-text: #0ca30c;
    --shadow: none;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--page); color: var(--ink); }
  body {
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: 20px 24px 40px;
  }
  h1 { font-size: 18px; font-weight: 650; margin: 0; letter-spacing: -0.01em; }
  h2 { font-size: 13px; font-weight: 600; margin: 0; color: var(--ink); }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .muted { color: var(--muted); }
  .ink2 { color: var(--ink-2); }
  code, pre { font-family: ui-monospace, "Cascadia Mono", Consolas, Menlo, monospace; }
  button, select, input {
    font: inherit; color: var(--ink); background: var(--surface);
    border: 1px solid var(--border); border-radius: 7px; padding: 6px 10px;
  }
  button { cursor: pointer; }
  button:hover { background: var(--surface-2); }
  input[type=search] { min-width: 260px; }
  [hidden] { display: none !important; }

  /* ── header + filters ────────────────────────────────────────────────── */
  .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; margin-bottom: 14px; }
  .sub { margin: 2px 0 0; color: var(--ink-2); font-size: 13px; }
  .top-right { display: flex; align-items: center; gap: 12px; font-size: 13px; color: var(--ink-2); white-space: nowrap; }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px;
          border: 1px solid var(--border); background: var(--surface); color: var(--ink); font-weight: 600; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); display: inline-block; }
  .dot.pulse { animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .35 } }
  .toggle { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
  .toggle input { margin: 0; }
  .theme-btn { padding: 3px 9px; font-size: 14px; line-height: 1.2; }

  .filters { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: var(--surface); }
  .seg button { border: 0; border-radius: 0; padding: 6px 12px; background: transparent; color: var(--ink-2); }
  .seg button + button { border-left: 1px solid var(--border); }
  .seg button.on { background: var(--accent-wash); color: var(--ink); font-weight: 600; }
  #count-line { margin-left: auto; font-size: 13px; }

  /* ── cards / layout ──────────────────────────────────────────────────── */
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow); margin-bottom: 14px;}
  #main { transition: opacity .2s; }
  #main.loading { opacity: .6; }

  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; margin-bottom: 14px; }
  .kpi { padding: 14px 16px 12px; display: flex; flex-direction: column; gap: 4px; min-height: 110px; }
  .kpi .label { font-size: 12px; color: var(--ink-2); }
  .kpi .value { font-size: 28px; font-weight: 600; line-height: 1.1; letter-spacing: -0.01em; }
  .kpi .note { font-size: 12px; color: var(--ink-2); min-height: 17px; }
  .kpi .foot { display: flex; justify-content: space-between; align-items: flex-end; gap: 8px; margin-top: auto; font-size: 12px; min-height: 28px; }
  .delta { font-weight: 600; white-space: nowrap; }
  .delta.good { color: var(--good-text); }
  .delta.bad  { color: var(--critical); }
  .delta.neutral { color: var(--ink-2); }
  .delta .muted { font-weight: 400; }
  .spark { flex: none; }

  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 12px; margin-bottom: 14px; }
  figure.card { margin: 0; padding: 14px 16px 12px; display: flex; flex-direction: column; gap: 8px; }
  .card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .card-head .sub { margin: 0; font-size: 12px; }
  .card-head .tools { display: flex; gap: 6px; flex: none; }
  .card-head .tools button { padding: 3px 9px; font-size: 12px; color: var(--ink-2); }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--ink-2); }
  .legend .key { display: inline-flex; align-items: center; gap: 6px; }
  .legend .sw { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
  .legend .sw.line { width: 14px; height: 2px; border-radius: 1px; }
  .viz { min-height: 200px; }
  .viz svg { display: block; overflow: visible; }
  .viz .grid-line { stroke: var(--grid); stroke-width: 1; shape-rendering: crispEdges; }
  .viz .axis-line { stroke: var(--axis); stroke-width: 1; shape-rendering: crispEdges; }
  .viz .tick { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
  .viz .end-label { fill: var(--ink); font-size: 12px; font-weight: 600; }
  .viz .hit { fill: transparent; }
  .viz .hit:hover, .viz .hit:focus { fill: var(--accent-wash); outline: none; }
  .viz .cross { stroke: var(--axis); stroke-width: 1; pointer-events: none; }
  .empty { color: var(--muted); padding: 40px 12px; text-align: center; font-size: 13px; }

  /* horizontal bars (HTML) */
  .hrows { display: flex; flex-direction: column; gap: 7px; padding-top: 4px; }
  .hrow { display: grid; grid-template-columns: 150px 1fr 48px; align-items: center; gap: 10px; border-radius: 6px; padding: 2px 4px; }
  .hrow:hover, .hrow:focus { background: var(--accent-wash); outline: none; }
  .hlabel { font-size: 12px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .htrack { height: 12px; position: relative; }
  .hbar { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 0 4px 4px 0; min-width: 2px; }
  .hval { font-size: 12px; text-align: right; font-variant-numeric: tabular-nums; color: var(--ink); }

  /* stacked share bar (part-to-whole) */
  .share { display: flex; height: 14px; gap: 2px; border-radius: 4px; overflow: hidden; background: var(--surface-2); }
  .share > span { display: block; height: 100%; }
  .share > span:last-child { border-radius: 0 4px 4px 0; }

  /* data table inside a card (table view / detail tables) */
  .tbl table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .tbl th, .tbl td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--grid); white-space: nowrap; }
  .tbl th { color: var(--muted); font-weight: 600; }
  .tbl td.num, .tbl th.num { text-align: right; font-variant-numeric: tabular-nums; }

  /* ── reviews table ───────────────────────────────────────────────────── */
  .table-card { padding: 0; overflow: hidden; }
  .table-card .card-head { padding: 14px 16px 10px; }
  .table-wrap { overflow-x: auto; }
  table.reviews { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.reviews th, table.reviews td { text-align: left; padding: 9px 12px; border-top: 1px solid var(--grid); white-space: nowrap; }
  table.reviews th { border-top: 0; color: var(--muted); font-weight: 600; cursor: pointer; user-select: none; position: sticky; top: 0; background: var(--surface); }
  table.reviews th:hover { color: var(--ink); }
  table.reviews th.sorted { color: var(--ink); }
  table.reviews th.sorted::after { content: " ▾"; font-size: 10px; }
  table.reviews th.sorted.asc::after { content: " ▴"; }
  table.reviews tbody tr { cursor: pointer; }
  table.reviews tbody tr:hover { background: var(--accent-wash); }
  table.reviews tbody tr.live { background: color-mix(in srgb, var(--accent) 6%, transparent); }
  table.reviews td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .badge { display: inline-flex; align-items: center; gap: 5px; padding: 1px 8px; border-radius: 999px; font-size: 11px;
           font-weight: 600; border: 1px solid var(--border); color: var(--ink-2); background: var(--surface); }
  .badge i { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
  .sevs { display: inline-flex; gap: 3px; }
  .sev { font-size: 11px; font-weight: 600; padding: 0 5px; border-radius: 4px; color: #fff; font-variant-numeric: tabular-nums; }
  .sev.critical { background: var(--critical); }
  .sev.high     { background: var(--serious); color: #1b1b1b; }
  .sev.medium   { background: var(--warning); color: #1b1b1b; }
  .sev.low      { background: var(--sev-low); }
  .fixchip { font-size: 11px; font-weight: 600; color: var(--ink-2); }

  /* ── tooltip ─────────────────────────────────────────────────────────── */
  .tip { position: fixed; z-index: 50; pointer-events: none; background: var(--surface); color: var(--ink);
         border: 1px solid var(--border); border-radius: 8px; box-shadow: 0 6px 24px rgba(0,0,0,.18);
         padding: 8px 10px; font-size: 12px; min-width: 150px; }
  .tip .t-head { color: var(--ink-2); margin-bottom: 4px; }
  .tip .t-row { display: flex; align-items: center; gap: 8px; }
  .tip .t-row .key { width: 12px; height: 2px; flex: none; }
  .tip .t-row .key.sq { height: 10px; width: 10px; border-radius: 2px; }
  .tip .t-row .v { font-weight: 600; font-variant-numeric: tabular-nums; margin-left: auto; }

  /* ── detail drawer ───────────────────────────────────────────────────── */
  .scrim { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 40; }
  .drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(780px, 100vw); z-index: 45; background: var(--surface);
            border-left: 1px solid var(--border); box-shadow: -12px 0 40px rgba(0,0,0,.25); display: flex; flex-direction: column; }
  .d-head { padding: 16px 20px 12px; border-bottom: 1px solid var(--grid); display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
  .d-head h2 { font-size: 15px; }
  .d-head .meta { color: var(--ink-2); font-size: 12px; margin-top: 3px; display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; }
  .d-body { overflow: auto; padding: 16px 20px 32px; display: flex; flex-direction: column; gap: 18px; }
  .d-close { border: 0; background: transparent; color: var(--muted); font-size: 18px; padding: 2px 8px; }
  .d-close:hover { color: var(--ink); background: transparent; }
  .verdict { background: var(--surface-2); border-radius: 10px; padding: 12px 14px; font-size: 13px; line-height: 1.5; }
  .meta-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; }
  .meta-grid .m { background: var(--surface-2); border-radius: 8px; padding: 8px 10px; }
  .meta-grid .m .l { font-size: 11px; color: var(--muted); }
  .meta-grid .m .v { font-size: 14px; font-weight: 600; margin-top: 2px; }
  .section h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 8px; font-weight: 600; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .chip { border-radius: 999px; padding: 2px 10px; font-size: 12px; color: var(--ink-2); }
  .chip.on { background: var(--accent-wash); color: var(--ink); border-color: transparent; }
  .chip i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 6px; vertical-align: 0; }
  .finding { border: 1px solid var(--grid); border-left-width: 3px; border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; }
  .finding.critical { border-left-color: var(--critical); }
  .finding.high     { border-left-color: var(--serious); }
  .finding.medium   { border-left-color: var(--warning); }
  .finding.low      { border-left-color: var(--sev-low); }
  .f-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .f-head strong { font-size: 13px; }
  .f-head code { font-size: 12px; color: var(--ink-2); }
  .agent-tag { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; color: var(--ink-2); }
  .agent-tag i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .finding p { margin: 6px 0 0; font-size: 13px; color: var(--ink-2); }
  .finding .sugg { color: var(--ink); }
  .fix { margin-top: 8px; border: 1px solid var(--grid); border-radius: 8px; overflow: hidden; }
  .fix-head { font-size: 12px; padding: 5px 10px; background: var(--surface-2); color: var(--ink-2); display: flex; justify-content: space-between; gap: 8px; }
  .fix pre { margin: 0; padding: 10px 12px; font-size: 12px; line-height: 1.45; overflow-x: auto; }
  details.exec { border: 1px solid var(--grid); border-radius: 8px; padding: 0; }
  details.exec summary { cursor: pointer; padding: 8px 12px; font-size: 13px; color: var(--ink-2); }
  details.exec .tbl { padding: 0 8px 8px; overflow-x: auto; }
  .agents-live { display: flex; flex-direction: column; gap: 6px; }
  .agents-live .row { display: flex; justify-content: space-between; padding: 6px 10px; background: var(--surface-2); border-radius: 8px; font-size: 13px; }
  .notes li { font-size: 13px; color: var(--ink-2); }

  @media (max-width: 720px) {
    body { padding: 14px; }
    .hrow { grid-template-columns: 110px 1fr 44px; }
    #count-line { margin-left: 0; }
  }
</style>
</head>
<body>

<header class="top">
  <div>
    <h1>Code Review Agent</h1>
    <p class="sub" id="sub">Loading…</p>
  </div>
  <div class="top-right">
    <span class="pill" id="live-pill" hidden><span class="dot pulse"></span><span id="live-count"></span></span>
    <span class="muted" id="refreshed"></span>
    <label class="toggle"><input type="checkbox" id="auto" checked> auto-refresh</label>
    <button class="theme-btn" id="theme-btn" aria-label="Toggle theme">◐</button>
  </div>
</header>

<section class="filters" aria-label="Filters">
  <div class="seg" id="range" role="group" aria-label="Date range">
    <button data-range="1">24h</button>
    <button data-range="7">7d</button>
    <button data-range="30" class="on">30d</button>
    <button data-range="90">90d</button>
    <button data-range="all">All</button>
  </div>
  <select id="f-instance" aria-label="Instance"><option value="">All instances</option></select>
  <select id="f-project" aria-label="Project"><option value="">All projects</option></select>
  <select id="f-status" aria-label="Status">
    <option value="">All statuses</option>
    <option value="success">Success</option>
    <option value="partial">Partial</option>
    <option value="failed">Failed</option>
    <option value="cancelled">Cancelled</option>
  </select>
  <input type="search" id="f-q" placeholder="Search project, MR, author, branch…" aria-label="Search">
  <span class="muted" id="count-line"></span>
</section>

<main id="main">
  <section class="card table-card">
    <div class="card-head">
      <div><h2>Reviews</h2><p class="sub" id="table-note"></p></div>
    </div>
    <div class="table-wrap">
      <table class="reviews" id="table">
        <thead><tr>
          <th data-key="project">Project</th>
          <th data-key="mr_iid">MR</th>
          <th data-key="mr_author">Author</th>
          <th data-key="branch">Branch</th>
          <th data-key="status">Status</th>
          <th data-key="started_at" class="sorted">Started</th>
          <th data-key="total_duration_s" class="num">Duration</th>
          <th data-key="total_issues">Issues</th>
          <th data-key="ai_fixes" class="num">Fixes</th>
          <th data-key="llm_requests_total" class="num">LLM</th>
          <th data-key="model">Model</th>
        </tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <div class="empty" id="empty" hidden></div>
  </section>

  <section class="kpis" id="kpis" aria-label="Key figures"></section>
  <section class="grid" id="charts"></section>
</main>

<div class="tip" id="tip" hidden></div>
<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" hidden aria-label="Review detail" role="dialog">
  <div class="d-head">
    <div style="min-width:0">
      <h2 id="d-title"></h2>
      <div class="meta" id="d-meta"></div>
    </div>
    <button class="d-close" id="d-close" aria-label="Close">✕</button>
  </div>
  <div class="d-body" id="d-body"></div>
</aside>

<script>
/* ═══════════════════════════════════════════════════════════════════════════
   helpers
   ═══════════════════════════════════════════════════════════════════════════ */
const $  = (sel, el = document) => el.querySelector(sel);
const $$ = (sel, el = document) => [...el.querySelectorAll(sel)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const sum = (list, key) => list.reduce((a, r) => a + (Number(r[key]) || 0), 0);
const median = xs => { if (!xs.length) return null; const s = [...xs].sort((a, b) => a - b); const m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };
const fmtNum = n => n == null ? "–" : n >= 1e6 ? (n / 1e6).toFixed(1) + "M" : n >= 1e4 ? Math.round(n / 1e3) + "K" : n >= 1e3 ? (n / 1e3).toFixed(1) + "K" : String(Math.round(n * 10) / 10);
function fmtDur(s) {
  if (s == null || isNaN(s)) return "–";
  if (s < 60) return (s < 10 ? Math.round(s * 10) / 10 : Math.round(s)) + "s";
  const m = Math.floor(s / 60), sec = Math.round(s % 60);
  if (m < 60) return `${m}m ${String(sec).padStart(2, "0")}s`;
  return `${Math.floor(m / 60)}h ${String(m % 60).padStart(2, "0")}m`;
}
const fmtTime = iso => iso ? iso.replace("T", " ").slice(0, 16) : "–";
const fmtDate = d => d.toLocaleDateString(undefined, { month: "short", day: "numeric" });
const pct = (a, b) => b ? Math.round(100 * a / b) + "%" : "–";
const startedMs = r => { const t = Date.parse(r.started_at); return isNaN(t) ? 0 : t; };
const projectKey = r => r.project_name || (r.project_id != null ? String(r.project_id) : (r.repository || "local"));
const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };

/* fixed identity → colour. An agent keeps its slot no matter which agents are
   on screen, so a filter never repaints the survivors. */
const AGENT_META = {
  code_quality:  { label: "Code quality",    color: "var(--s1)" },
  security:      { label: "Security",        color: "var(--s2)" },
  performance:   { label: "Performance",     color: "var(--s3)" },
  documentation: { label: "Documentation",   color: "var(--s4)" },
  static:        { label: "Static analysis", color: "var(--s5)" },
  summary:       { label: "Summary",         color: "var(--s6)" },
};
const AGENT_ORDER = Object.keys(AGENT_META);
const agentKey  = a => (a || "").startsWith("static:") ? "static" : a;
const agentMeta = a => AGENT_META[agentKey(a)] || { label: a, color: "var(--muted)" };
const SEV = [
  { key: "critical", label: "Critical", color: "var(--critical)" },
  { key: "high",     label: "High",     color: "var(--serious)" },
  { key: "medium",   label: "Medium",   color: "var(--warning)" },
  { key: "low",      label: "Low",      color: "var(--sev-low)" },
];
const STATUS = {
  success:   { label: "success",   color: "var(--good)" },
  partial:   { label: "partial",   color: "var(--warning)" },
  failed:    { label: "failed",    color: "var(--critical)" },
  error:     { label: "failed",    color: "var(--critical)" },
  cancelled: { label: "cancelled", color: "var(--warning)" },
  running:   { label: "running",   color: "var(--accent)" },
};
const statusBadge = s => { const m = STATUS[s] || { label: s || "–", color: "var(--muted)" }; return `<span class="badge"><i style="background:${m.color}"></i>${esc(m.label)}</span>`; };
const sevChips = r => {
  const parts = SEV.filter(s => r[s.key + "_count"]).map(s => `<span class="sev ${s.key}" title="${s.label}">${r[s.key + "_count"]}${s.label[0]}</span>`);
  return parts.length ? `<span class="sevs">${parts.join("")}</span>` : `<span class="muted">0</span>`;
};

/* ═══════════════════════════════════════════════════════════════════════════
   state + data
   ═══════════════════════════════════════════════════════════════════════════ */
const state = {
  reports: [], live: [],
  range: "30", instance: "", project: "", status: "", q: "",
  sortKey: "started_at", sortDir: -1,
  tableView: {},            // chart id → true when the table twin is shown
  detail: null,             // { file } or { live: {instance, project_id, mr_iid} }
};
let lastSlice = { cur: [], prev: [], buckets: [] };

const rangeMs    = () => state.range === "all" ? null : Number(state.range) * 864e5;
const rangeLabel = () => ({ "1": "24h", "7": "7 days", "30": "30 days", "90": "90 days" })[state.range] || "period";

function currentSlice() {
  const now = Date.now(), span = rangeMs();
  const base = state.reports.filter(r => {
    if (state.instance && (r.instance || "") !== state.instance) return false;
    if (state.project && projectKey(r) !== state.project) return false;
    if (state.status && r.status !== state.status) return false;
    if (state.q) {
      const hay = [r.instance, r.project_id, r.project_name, r.repository, r.mr_iid != null ? "!" + r.mr_iid : "", r.mr_title, r.mr_author, r.branch, r.model].join(" ").toLowerCase();
      if (!hay.includes(state.q)) return false;
    }
    return true;
  });
  const cur  = base.filter(r => span == null || startedMs(r) >= now - span);
  const prev = span == null ? [] : base.filter(r => { const t = startedMs(r); return t >= now - 2 * span && t < now - span; });
  return { cur, prev, buckets: makeBuckets(cur) };
}

const floorDay  = t => { const d = new Date(t); d.setHours(0, 0, 0, 0); return d.getTime(); };
const floorHour = t => { const d = new Date(t); d.setMinutes(0, 0, 0); return d.getTime(); };

function makeBuckets(list) {
  const now = Date.now(), span = rangeMs();
  let start;
  if (span == null) { const ts = list.map(startedMs).filter(Boolean); start = ts.length ? Math.min(...ts) : now - 30 * 864e5; }
  else start = now - span;
  const days = (now - start) / 864e5;
  let step, fmt;
  if (days <= 1.05)     { step = 36e5;      fmt = d => d.toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" }); start = floorHour(start); }
  else if (days <= 45)  { step = 864e5;     fmt = fmtDate; start = floorDay(start); }
  else                  { step = 7 * 864e5; fmt = d => "wk of " + fmtDate(d); start = floorDay(start); }
  const buckets = [];
  for (let t = start; t <= now; t += step) {
    buckets.push({ t, label: fmt(new Date(t)), reviews: [], critical: 0, high: 0, medium: 0, low: 0, success: 0, failed: 0, other: 0, durations: [] });
  }
  for (const r of list) {
    const t = startedMs(r); if (!t) continue;
    const i = Math.max(0, Math.min(buckets.length - 1, Math.floor((t - start) / step)));
    const b = buckets[i];
    b.reviews.push(r);
    for (const s of SEV) b[s.key] += Number(r[s.key + "_count"]) || 0;
    if (r.status === "failed") b.failed++; else if (r.status === "success") b.success++; else b.other++;
    if (r.total_duration_s) b.durations.push(r.total_duration_s);
  }
  return buckets;
}

/* ═══════════════════════════════════════════════════════════════════════════
   tooltip (single floating element, text inserted via textContent)
   ═══════════════════════════════════════════════════════════════════════════ */
const tip = $("#tip");
function showTip(ev, head, rows) {
  tip.innerHTML = "";
  if (head) { const h = document.createElement("div"); h.className = "t-head"; h.textContent = head; tip.appendChild(h); }
  for (const r of rows) {
    const row = document.createElement("div"); row.className = "t-row";
    if (r.color) { const k = document.createElement("span"); k.className = "key" + (r.square ? " sq" : ""); k.style.background = r.color; row.appendChild(k); }
    const l = document.createElement("span"); l.textContent = r.label; row.appendChild(l);
    const v = document.createElement("span"); v.className = "v"; v.textContent = r.value; row.appendChild(v);
    tip.appendChild(row);
  }
  tip.hidden = false;
  const pad = 14, w = tip.offsetWidth, h = tip.offsetHeight;
  let x = ev.clientX + pad, y = ev.clientY + pad;
  if (x + w > innerWidth - 8)  x = ev.clientX - w - pad;
  if (y + h > innerHeight - 8) y = ev.clientY - h - pad;
  tip.style.left = x + "px"; tip.style.top = y + "px";
}
const hideTip = () => { tip.hidden = true; };

/* ═══════════════════════════════════════════════════════════════════════════
   chart primitives — plain SVG / HTML, no library
   ═══════════════════════════════════════════════════════════════════════════ */
const DUR_STEPS = [1, 2, 5, 10, 15, 30, 60, 120, 300, 600, 900, 1800, 3600, 7200, 14400];
function niceTicks(max, n = 4, unit) {
  max = Math.max(max, 1);
  const raw = max / n, mag = Math.pow(10, Math.floor(Math.log10(raw))), norm = raw / mag;
  // durations tick on clock-friendly steps (30s, 1m, 5m, …) rather than decimal
  // ones; counts never tick on fractions
  let step = unit === "s" ? (DUR_STEPS.find(s => max / s <= n) || DUR_STEPS[DUR_STEPS.length - 1])
                          : (norm <= 1 ? 1 : norm <= 2 ? 2 : norm <= 5 ? 5 : 10) * mag;
  if (unit === "int") step = Math.max(1, Math.round(step));
  const top = Math.ceil(max / step) * step, ticks = [];
  for (let v = 0; v <= top + 1e-9; v += step) ticks.push(Math.round(v * 1e6) / 1e6);
  return ticks;
}
function roundTop(x, y, w, h, r) {
  r = Math.min(r, h, w / 2);
  return `M${x},${y + h} V${y + r} Q${x},${y} ${x + r},${y} H${x + w - r} Q${x + w},${y} ${x + w},${y + r} V${y + h} Z`;
}
function legendHtml(series, shape = "sq") {
  return `<div class="legend">${series.map(s => `<span class="key"><span class="sw ${shape === "line" ? "line" : ""}" style="background:${s.color}"></span>${esc(s.label)}</span>`).join("")}</div>`;
}
function emptyViz(el, msg) { el.innerHTML = `<div class="empty">${esc(msg || "No reviews in this range")}</div>`; }

/* stacked columns: buckets × series, 2px surface gap between segments, ≤24px wide,
   rounded data-end only, whole band is the hover target. */
function columnChart(el, buckets, series, { fmt = fmtNum, tipHead } = {}) {
  if (!buckets.length || !buckets.some(b => series.some(s => b[s.key]))) return emptyViz(el);
  const W = Math.max(280, el.clientWidth || 600), H = 220, padL = 40, padR = 8, padT = 10, padB = 24;
  const plotW = W - padL - padR, plotH = H - padT - padB;
  const totals = buckets.map(b => series.reduce((a, s) => a + (b[s.key] || 0), 0));
  const ticks = niceTicks(Math.max(...totals), 4, "int"), top = ticks[ticks.length - 1];
  const band = plotW / buckets.length, bw = Math.min(24, Math.max(3, band - 4));
  const y = v => padT + plotH - (v / top) * plotH;
  const labelEvery = Math.max(1, Math.ceil(buckets.length / Math.floor(plotW / 64)));
  let svg = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(tipHead || "chart")}">`;
  for (const t of ticks) svg += `<line class="grid-line" x1="${padL}" x2="${W - padR}" y1="${y(t)}" y2="${y(t)}"/><text class="tick" x="${padL - 6}" y="${y(t) + 3.5}" text-anchor="end">${esc(fmt(t))}</text>`;
  svg += `<line class="axis-line" x1="${padL}" x2="${W - padR}" y1="${y(0)}" y2="${y(0)}"/>`;
  buckets.forEach((b, i) => {
    const x = padL + i * band + (band - bw) / 2;
    const segs = series.filter(s => (b[s.key] || 0) > 0);
    let acc = 0;
    segs.forEach((s, j) => {
      const v = b[s.key], isTop = j === segs.length - 1;
      const y1 = y(acc + v), y0 = y(acc);
      const gap = isTop ? 0 : 2, h = y0 - y1 - gap;
      if (h > 0.5) svg += isTop ? `<path d="${roundTop(x, y1, bw, h, 4)}" style="fill:${s.color}"/>` : `<rect x="${x}" y="${y1 + gap}" width="${bw}" height="${h}" style="fill:${s.color}"/>`;
      acc += v;
    });
    svg += `<rect class="hit" data-i="${i}" x="${padL + i * band}" y="${padT}" width="${band}" height="${plotH}" tabindex="0"/>`;
    if (i % labelEvery === 0) svg += `<text class="tick" x="${padL + i * band + band / 2}" y="${H - 6}" text-anchor="middle">${esc(b.label)}</text>`;
  });
  el.innerHTML = svg + "</svg>";
  $$(".hit", el).forEach(h => {
    const b = buckets[+h.dataset.i];
    const rows = series.map(s => ({ color: s.color, square: true, label: s.label, value: fmt(b[s.key] || 0) }));
    const show = ev => showTip(ev, `${b.label} · ${b.reviews.length} review${b.reviews.length === 1 ? "" : "s"}`, rows);
    h.addEventListener("pointermove", show);
    h.addEventListener("focus", ev => { const r = h.getBoundingClientRect(); show({ clientX: r.left + r.width / 2, clientY: r.top + 20 }); });
    h.addEventListener("pointerleave", hideTip); h.addEventListener("blur", hideTip);
  });
}

/* single-series line with 10% area wash, end marker + end label, crosshair tooltip */
function lineChart(el, buckets, valueOf, { fmt = fmtNum, label = "", extra, unit } = {}) {
  const pts = buckets.map((b, i) => ({ i, b, v: valueOf(b) })).filter(p => p.v != null);
  if (pts.length < 1) return emptyViz(el);
  const W = Math.max(280, el.clientWidth || 600), H = 220, padL = 48, padR = 56, padT = 14, padB = 24;
  const plotW = W - padL - padR, plotH = H - padT - padB;
  const ticks = niceTicks(Math.max(...pts.map(p => p.v)), 4, unit), top = ticks[ticks.length - 1];
  const x = i => padL + (buckets.length === 1 ? plotW / 2 : (i / (buckets.length - 1)) * plotW);
  const y = v => padT + plotH - (v / top) * plotH;
  const labelEvery = Math.max(1, Math.ceil(buckets.length / Math.floor(plotW / 64)));
  let svg = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}">`;
  for (const t of ticks) svg += `<line class="grid-line" x1="${padL}" x2="${W - padR}" y1="${y(t)}" y2="${y(t)}"/><text class="tick" x="${padL - 6}" y="${y(t) + 3.5}" text-anchor="end">${esc(fmt(t))}</text>`;
  svg += `<line class="axis-line" x1="${padL}" x2="${W - padR}" y1="${y(0)}" y2="${y(0)}"/>`;
  buckets.forEach((b, i) => { if (i % labelEvery === 0) svg += `<text class="tick" x="${x(i)}" y="${H - 6}" text-anchor="middle">${esc(b.label)}</text>`; });
  // break the line where a bucket has no value, so gaps aren't invented; a
  // run of one point gets a marker since a zero-length line is invisible
  let d = "", run = [], singles = [];
  const flush = () => {
    if (!run.length) return;
    if (run.length === 1) singles.push(run[0]);
    d += run.map((p, k) => `${k ? "L" : "M"}${x(p.i)},${y(p.v)}`).join(" ") + " ";
    run = [];
  };
  buckets.forEach((b, i) => { const p = pts.find(q => q.i === i); if (p) run.push(p); else flush(); }); flush();
  svg += `<path d="${d}" style="fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round"/>`;
  for (const p of singles) svg += `<circle cx="${x(p.i)}" cy="${y(p.v)}" r="4" style="fill:var(--accent);stroke:var(--surface);stroke-width:2"/>`;
  const last = pts[pts.length - 1];
  svg += `<circle cx="${x(last.i)}" cy="${y(last.v)}" r="4" style="fill:var(--accent);stroke:var(--surface);stroke-width:2"/>`;
  svg += `<text class="end-label" x="${x(last.i) + 8}" y="${y(last.v) + 4}">${esc(fmt(last.v))}</text>`;
  svg += `<line class="cross" id="cross" x1="0" x2="0" y1="${padT}" y2="${padT + plotH}" style="display:none"/>`;
  svg += `<circle id="cross-dot" r="4" style="display:none;fill:var(--accent);stroke:var(--surface);stroke-width:2"/>`;
  svg += `<rect class="hit" x="${padL}" y="${padT}" width="${plotW}" height="${plotH}" style="fill:transparent"/>`;
  el.innerHTML = svg + "</svg>";
  const svgEl = $("svg", el), cross = $("#cross", el), dot = $("#cross-dot", el), hit = $(".hit", el);
  hit.style.fill = "transparent";
  hit.addEventListener("pointermove", ev => {
    const rect = svgEl.getBoundingClientRect();
    const px = (ev.clientX - rect.left) * (W / rect.width);
    let best = 0, bestD = Infinity;
    buckets.forEach((b, i) => { const dd = Math.abs(x(i) - px); if (dd < bestD) { bestD = dd; best = i; } });
    const b = buckets[best], p = pts.find(q => q.i === best);
    cross.setAttribute("x1", x(best)); cross.setAttribute("x2", x(best)); cross.style.display = "";
    if (p) { dot.setAttribute("cx", x(best)); dot.setAttribute("cy", y(p.v)); dot.style.display = ""; } else dot.style.display = "none";
    const rows = [{ color: "var(--accent)", label, value: p ? fmt(p.v) : "no data" }];
    if (extra) rows.push(...extra(b));
    showTip(ev, `${b.label} · ${b.reviews.length} review${b.reviews.length === 1 ? "" : "s"}`, rows);
  });
  hit.addEventListener("pointerleave", () => { cross.style.display = "none"; dot.style.display = "none"; hideTip(); });
}

/* horizontal bars in HTML: label column, 12px bar, value at the tip */
function hbars(el, rows, { fmt = fmtNum, color = () => "var(--s1)", tipRows } = {}) {
  if (!rows.length) return emptyViz(el);
  const max = Math.max(1, ...rows.map(r => r.value));
  el.innerHTML = `<div class="hrows">${rows.map((r, i) => `
    <div class="hrow" tabindex="0" data-i="${i}">
      <span class="hlabel" title="${esc(r.label)}">${esc(r.label)}</span>
      <span class="htrack"><span class="hbar" style="width:${(100 * r.value / max).toFixed(2)}%;background:${color(r)}"></span></span>
      <span class="hval">${esc(fmt(r.value))}</span>
    </div>`).join("")}</div>`;
  $$(".hrow", el).forEach(h => {
    const r = rows[+h.dataset.i];
    const show = ev => showTip(ev, r.label, tipRows ? tipRows(r) : [{ color: color(r), square: true, label: "Value", value: fmt(r.value) }]);
    h.addEventListener("pointermove", show);
    h.addEventListener("focus", ev => { const b = h.getBoundingClientRect(); show({ clientX: b.left + 160, clientY: b.top + 8 }); });
    h.addEventListener("pointerleave", hideTip); h.addEventListener("blur", hideTip);
  });
}

/* part-to-whole stacked bar with 2px gaps and its own legend + values */
function shareBar(parts, fmt = fmtNum) {
  const total = parts.reduce((a, p) => a + p.value, 0);
  if (!total) return `<div class="muted" style="font-size:12px">nothing recorded</div>`;
  const bar = parts.filter(p => p.value > 0).map(p => `<span title="${esc(p.label)}: ${esc(fmt(p.value))}" style="width:${(100 * p.value / total).toFixed(2)}%;background:${p.color}"></span>`).join("");
  const keys = parts.map(p => `<span class="key"><span class="sw" style="background:${p.color}"></span>${esc(p.label)} <strong style="color:var(--ink)">${esc(fmt(p.value))}</strong> <span class="muted">${pct(p.value, total)}</span></span>`).join("");
  return `<div class="share">${bar}</div><div class="legend" style="margin-top:6px">${keys}</div>`;
}

function sparkline(values) {
  const W = 120, H = 28;
  if (!values.length || values.every(v => !v)) return `<svg class="spark" width="${W}" height="${H}"></svg>`;
  const max = Math.max(...values, 1), n = values.length;
  const x = i => n === 1 ? W / 2 : 2 + (i / (n - 1)) * (W - 8), y = v => H - 3 - (v / max) * (H - 8);
  const d = values.map((v, i) => `${i ? "L" : "M"}${x(i)},${y(v)}`).join(" ");
  const li = n - 1;
  return `<svg class="spark" width="${W}" height="${H}" aria-hidden="true"><path d="${d}" style="fill:none;stroke:var(--axis);stroke-width:2;stroke-linejoin:round;stroke-linecap:round"/><circle cx="${x(li)}" cy="${y(values[li])}" r="3.5" style="fill:var(--accent);stroke:var(--surface);stroke-width:2"/></svg>`;
}

/* ═══════════════════════════════════════════════════════════════════════════
   KPI tiles
   ═══════════════════════════════════════════════════════════════════════════ */
function delta(cur, prev, mode, fmt = v => v) {
  if (state.range === "all" || prev == null || !isFinite(prev) || prev === 0 || cur == null) return "";
  const diff = cur - prev;
  if (Math.abs(diff) < 1e-9) return `<span class="delta neutral">no change <span class="muted">vs previous ${rangeLabel()}</span></span>`;
  const up = diff > 0, p = Math.round(100 * Math.abs(diff) / prev);
  const good = mode === "neutral" ? null : (mode === "downGood" ? !up : up);
  const cls = good == null ? "neutral" : good ? "good" : "bad";
  return `<span class="delta ${cls}" title="${esc(fmt(prev))} in the previous ${rangeLabel()}">${up ? "▲" : "▼"} ${up ? "+" : "−"}${p}% <span class="muted">vs previous ${rangeLabel()}</span></span>`;
}
function downsample(values, n = 14) {
  if (values.length <= n) return values;
  const size = values.length / n, out = [];
  for (let i = 0; i < n; i++) out.push(values.slice(Math.floor(i * size), Math.floor((i + 1) * size)).reduce((a, b) => a + b, 0));
  return out;
}
function renderKpis({ cur, prev, buckets }) {
  const issues = sum(cur, "total_issues"), prevIssues = sum(prev, "total_issues");
  const fixes = sum(cur, "ai_fixes");
  const durs = cur.map(r => r.total_duration_s).filter(Boolean), prevDurs = prev.map(r => r.total_duration_s).filter(Boolean);
  const med = median(durs), prevMed = median(prevDurs);
  const llmTotal = sum(cur, "llm_requests_total"), llmFailed = sum(cur, "llm_requests_failed");
  const prevLlmTotal = sum(prev, "llm_requests_total"), prevLlmFailed = sum(prev, "llm_requests_failed");
  const failed = cur.filter(r => r.status === "failed").length, prevFailed = prev.filter(r => r.status === "failed").length;
  const okRate = llmTotal ? (llmTotal - llmFailed) / llmTotal : null, prevOkRate = prevLlmTotal ? (prevLlmTotal - prevLlmFailed) / prevLlmTotal : null;
  const sevMini = SEV.filter(s => sum(cur, s.key + "_count")).map(s => `<span class="sev ${s.key}" title="${s.label}">${fmtNum(sum(cur, s.key + "_count"))}${s.label[0]}</span>`).join("");
  const slowest = durs.length ? Math.max(...durs) : null;
  const tiles = [
    { label: "Reviews", value: fmtNum(cur.length), note: state.live.length ? `${state.live.length} running now` : `${cur.filter(r => r.status === "success").length} succeeded`, foot: delta(cur.length, prev.length, "neutral"), spark: downsample(buckets.map(b => b.reviews.length)) },
    { label: "Issues found", value: fmtNum(issues), note: `<span class="sevs">${sevMini}</span>`, foot: delta(issues, prevIssues, "downGood") },
    { label: "Fixes ready to apply", value: fmtNum(fixes), note: `${pct(fixes, issues)} of findings carry a one-click fix`, foot: delta(fixes, sum(prev, "ai_fixes"), "upGood") },
    { label: "Median review time", value: fmtDur(med), note: slowest != null ? `slowest ${fmtDur(slowest)}` : "", foot: delta(med, prevMed, "downGood", fmtDur), spark: downsample(buckets.map(b => median(b.durations) || 0)) },
    { label: "LLM request success", value: okRate == null ? "–" : Math.round(okRate * 100) + "%", note: `${fmtNum(llmFailed)} failed of ${fmtNum(llmTotal)} requests`, foot: okRate != null && prevOkRate != null ? delta(okRate, prevOkRate, "upGood", v => Math.round(v * 100) + "%") : "" },
    { label: "Failed reviews", value: fmtNum(failed), note: cur.length ? `${pct(failed, cur.length)} of reviews` : "", foot: delta(failed, prevFailed, "downGood") },
  ];
  $("#kpis").innerHTML = tiles.map(t => `
    <div class="card kpi">
      <div class="label">${esc(t.label)}</div>
      <div class="value">${t.value}</div>
      <div class="note">${t.note || ""}</div>
      <div class="foot"><span>${t.foot || ""}</span>${t.spark ? sparkline(t.spark) : ""}</div>
    </div>`).join("");
}

/* ═══════════════════════════════════════════════════════════════════════════
   chart cards
   ═══════════════════════════════════════════════════════════════════════════ */
const CHARTS = [
  {
    id: "sev-trend", title: "Issues over time", sub: "findings per review start date, by severity",
    legend: SEV,
    draw: (el, s) => columnChart(el, s.buckets, SEV, { tipHead: "Issues over time" }),
    table: s => ({ head: ["Period", ...SEV.map(x => x.label), "Reviews"], rows: s.buckets.map(b => [b.label, ...SEV.map(x => b[x.key]), b.reviews.length]) }),
  },
  {
    id: "throughput", title: "Reviews over time", sub: "completed reviews, failed ones highlighted",
    legend: [{ label: "Succeeded", color: "var(--s1)" }, { label: "Failed", color: "var(--critical)" }, { label: "Cancelled", color: "var(--warning)" }],
    draw: (el, s) => columnChart(el, s.buckets, [{ key: "success", label: "Succeeded", color: "var(--s1)" }, { key: "failed", label: "Failed", color: "var(--critical)" }, { key: "other", label: "Cancelled", color: "var(--warning)" }], { tipHead: "Reviews over time" }),
    table: s => ({ head: ["Period", "Succeeded", "Failed", "Cancelled"], rows: s.buckets.map(b => [b.label, b.success, b.failed, b.other]) }),
  },
  {
    id: "duration", title: "Review time", sub: "median end-to-end duration per period",
    draw: (el, s) => lineChart(el, s.buckets, b => median(b.durations), { fmt: fmtDur, unit: "s", label: "Median duration", extra: b => b.durations.length ? [{ label: "Slowest", value: fmtDur(Math.max(...b.durations)) }] : [] }),
    table: s => ({ head: ["Period", "Median", "Slowest", "Reviews"], rows: s.buckets.map(b => [b.label, fmtDur(median(b.durations)), b.durations.length ? fmtDur(Math.max(...b.durations)) : "–", b.reviews.length]) }),
  },
  {
    id: "by-agent", title: "Findings by agent", sub: "which reviewer finds the most — static analysis tools grouped",
    draw: (el, s) => {
      const counts = {};
      for (const r of s.cur) for (const [a, n] of Object.entries(r.findings_by_agent || {})) counts[agentKey(a)] = (counts[agentKey(a)] || 0) + n;
      const rows = AGENT_ORDER.filter(a => counts[a]).map(a => ({ key: a, label: AGENT_META[a].label, value: counts[a] }));
      hbars(el, rows, { color: r => AGENT_META[r.key].color, tipRows: r => [{ color: AGENT_META[r.key].color, square: true, label: "Findings", value: fmtNum(r.value) }, { label: "Share", value: pct(r.value, rows.reduce((a, x) => a + x.value, 0)) }] });
    },
    table: s => { const counts = {}; for (const r of s.cur) for (const [a, n] of Object.entries(r.findings_by_agent || {})) counts[agentKey(a)] = (counts[agentKey(a)] || 0) + n; return { head: ["Agent", "Findings"], rows: AGENT_ORDER.filter(a => counts[a]).map(a => [AGENT_META[a].label, counts[a]]) }; },
  },
  {
    id: "latency", title: "LLM time per request", sub: "average seconds each agent spends per file, with failure counts",
    draw: (el, s) => {
      const agg = {};
      for (const r of s.cur) for (const [a, st] of Object.entries(r.agent_stats || {})) { const k = agentKey(a); const g = agg[k] = agg[k] || { requests: 0, failed: 0, total_s: 0 }; g.requests += st.requests || 0; g.failed += st.failed || 0; g.total_s += st.total_s || 0; }
      const rows = AGENT_ORDER.filter(a => agg[a] && agg[a].requests).map(a => ({ key: a, label: AGENT_META[a].label, value: agg[a].total_s / agg[a].requests, ...agg[a] }));
      hbars(el, rows, { fmt: fmtDur, color: r => AGENT_META[r.key].color, tipRows: r => [{ color: AGENT_META[r.key].color, square: true, label: "Avg per request", value: fmtDur(r.value) }, { label: "Requests", value: fmtNum(r.requests) }, { label: "Failed", value: `${fmtNum(r.failed)} (${pct(r.failed, r.requests)})` }] });
    },
    table: s => { const agg = {}; for (const r of s.cur) for (const [a, st] of Object.entries(r.agent_stats || {})) { const k = agentKey(a); const g = agg[k] = agg[k] || { requests: 0, failed: 0, total_s: 0 }; g.requests += st.requests || 0; g.failed += st.failed || 0; g.total_s += st.total_s || 0; } return { head: ["Agent", "Avg / request", "Requests", "Failed"], rows: AGENT_ORDER.filter(a => agg[a] && agg[a].requests).map(a => [AGENT_META[a].label, fmtDur(agg[a].total_s / agg[a].requests), agg[a].requests, agg[a].failed]) }; },
  },
  {
    id: "hotspots", title: "Hotspot files", sub: "files with the most findings across reviews",
    draw: (el, s) => {
      const counts = {};
      for (const r of s.cur) for (const [f, n] of Object.entries(r.findings_by_file || {})) counts[f] = (counts[f] || 0) + n;
      const rows = Object.entries(counts).sort((a, b) => b[1] - a[1]).slice(0, 8).map(([f, n]) => ({ label: f, value: n }));
      hbars(el, rows, { tipRows: r => [{ color: "var(--s1)", square: true, label: "Findings", value: fmtNum(r.value) }] });
    },
    table: s => { const counts = {}; for (const r of s.cur) for (const [f, n] of Object.entries(r.findings_by_file || {})) counts[f] = (counts[f] || 0) + n; return { head: ["File", "Findings"], rows: Object.entries(counts).sort((a, b) => b[1] - a[1]).slice(0, 20) }; },
  },
];

function sortValue(r, key) {

/* tiny markdown: escape everything, then allow **bold** and line breaks */
const mdLite = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/\n/g, "<br>");

async function openDetail(file) {
  state.detail = { file };
  history.replaceState(null, "", `#report=${encodeURIComponent(file)}`);  // deep link to this report
  showDrawer(file, "");
  let d;
  try { const res = await fetch(`/api/reports/${encodeURIComponent(file)}`); if (!res.ok) throw new Error(res.status); d = await res.json(); }
  catch (e) { $("#d-body").innerHTML = `<div class="muted">Could not load this report (${esc(e.message || e)}).</div>`; return; }

      </div>

async function openLive(l) {

async function refreshLive() {

/* filters live in the query string so a view can be bookmarked or shared */
const RANGES = ["1", "7", "30", "90", "all"], STATUSES = ["success", "partial", "failed", "cancelled"];
function readFiltersFromUrl() {
  const p = new URLSearchParams(location.search);
  if (RANGES.includes(p.get("range"))) state.range = p.get("range");
  if (STATUSES.includes(p.get("status"))) state.status = p.get("status");
  state.instance = p.get("instance") || ""; state.project = p.get("project") || "";
  state.q = (p.get("q") || "").trim().toLowerCase();
  $$("#range button").forEach(b => b.classList.toggle("on", b.dataset.range === state.range));
  $("#f-status").value = state.status; $("#f-q").value = p.get("q") || "";
}
function writeFiltersToUrl() {
  const p = new URLSearchParams(location.search);
  const set = (k, v, def) => (v && v !== def) ? p.set(k, v) : p.delete(k);
  set("range", state.range, "30"); set("instance", state.instance, ""); set("project", state.project, "");
  set("status", state.status, ""); set("q", $("#f-q").value.trim(), "");
  const qs = p.toString(), next = location.pathname + (qs ? "?" + qs : "") + location.hash;
  if (next !== location.pathname + location.search + location.hash) history.replaceState(null, "", next);
}

/* theme: auto (follow the OS) → dark → light, remembered per browser; ?theme= overrides */
const THEMES = ["auto", "dark", "light"], THEME_ICON = { auto: "◐", dark: "☾", light: "☀" };
let theme = new URLSearchParams(location.search).get("theme");
if (!THEMES.includes(theme)) { try { theme = localStorage.getItem("cra-theme"); } catch (e) { theme = null; } }
if (!THEMES.includes(theme)) theme = "auto";
function applyTheme(t) {
  if (t === "auto") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme", t);
  const b = $("#theme-btn"); b.textContent = THEME_ICON[t]; b.title = `Theme: ${t} — click to change`;
}
$("#theme-btn").addEventListener("click", () => {
  theme = THEMES[(THEMES.indexOf(theme) + 1) % THEMES.length];
  try { localStorage.setItem("cra-theme", theme); } catch (e) {}
  applyTheme(theme);
});
applyTheme(theme);

async function refresh() {
  const main = $("#main"); main.classList.add("loading");
  try {
    const [repRes, actRes] = await Promise.all([fetch("/api/reports?limit=500"), fetch("/review/active")]);
    if (!repRes.ok) throw new Error(`reports ${repRes.status}`);
    state.reports = await repRes.json();
    const active = actRes.ok ? await actRes.json() : [];
    state.live = active.filter(a => a.status === "running");
    populateFilterOptions(); render();
    $("#refreshed").textContent = "updated " + new Date().toLocaleTimeString();
    if (state.detail && state.detail.live) refreshLive();
  } catch (e) { $("#sub").textContent = "Failed to load reports: " + (e.message || e); }
  finally { main.classList.remove("loading"); }
}

$$("#range button").forEach(b => b.addEventListener("click", () => { $$("#range button").forEach(x => x.classList.remove("on")); b.classList.add("on"); state.range = b.dataset.range; render(); }));
$("#f-instance").addEventListener("change", ev => { state.instance = ev.target.value; render(); });
$("#f-project").addEventListener("change", ev => { state.project = ev.target.value; render(); });
$("#f-status").addEventListener("change", ev => { state.status = ev.target.value; render(); });
$("#f-q").addEventListener("input", debounce(ev => { state.q = ev.target.value.trim().toLowerCase(); render(); }, 120));
$$("th[data-key]").forEach(th => th.addEventListener("click", () => { const k = th.dataset.key; if (state.sortKey === k) state.sortDir *= -1; else { state.sortKey = k; state.sortDir = k === "started_at" || k === "total_issues" || k === "ai_fixes" || k === "total_duration_s" || k === "llm_requests_total" ? -1 : 1; } renderTable(lastSlice); }));
window.addEventListener("resize", debounce(() => renderCharts(lastSlice), 150));
setInterval(() => { if ($("#auto").checked) refresh(); }, 10000);

buildChartCards();
readFiltersFromUrl();
refresh().then(() => {
  const m = /^#report=(.+)$/.exec(location.hash);
  if (m) openDetail(decodeURIComponent(m[1]));
});
</script>
